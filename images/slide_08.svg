<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="20" fill="url(#bg8)"/>

  <!-- 좌측: 모래성 + 돋보기 (직접 테스트) -->
  <g transform="translate(60, 40)" filter="url(#shadow8)">
    <!-- 모래 바닥 -->
    <ellipse cx="200" cy="310" rx="140" ry="35" fill="#b45309" opacity="0.6"/>
    <!-- 모래성 본체 -->
    <rect x="130" y="210" width="140" height="90" rx="12" fill="url(#sand)"/>
    <!-- 탑 2개 -->
    <rect x="110" y="150" width="45" height="80" rx="10" fill="url(#sand)"/>
    <rect x="245" y="150" width="45" height="80" rx="10" fill="url(#sand)"/>
    <!-- 탑 지붕 -->
    <polygon points="132,110 100,150 165,150" fill="#f59e0b"/>
    <polygon points="267,110 235,150 300,150" fill="#f59e0b"/>
    <!-- 깃발 -->
    <line x1="132" y1="110" x2="132" y2="85" stroke="#78350f" stroke-width="3"/>
    <polygon points="132,85 155,95 132,105" fill="#f43f5e"/>

    <!-- 돋보기 -->
    <circle cx="270" cy="190" r="45" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="7"/>
    <circle cx="258" cy="178" r="14" fill="rgba(255, 255, 255, 0.4)"/>
    <line x1="305" y1="225" x2="350" y2="270" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- 우측: 황금 자물쇠 (보안 챙기기) -->
  <g transform="translate(460, 70)" filter="url(#shadow8)">
    <!-- 자물쇠 고리 -->
    <path d="M 90 140 C 90 60 170 60 170 140" fill="none" stroke="#e2e8f0" stroke-width="22" stroke-linecap="round"/>
    <!-- 자물쇠 몸체 -->
    <rect x="60" y="130" width="140" height="120" rx="24" fill="url(#gold)"/>
    <!-- 열쇠 구멍 -->
    <circle cx="130" cy="180" r="12" fill="#78350f"/>
    <polygon points="125,185 135,185 138,215 122,215" fill="#78350f"/>
    <!-- 반짝임 -->
    <circle cx="95" cy="155" r="5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- 텍스트 배너 -->
  <rect x="180" y="380" width="440" height="42" rx="12" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1"/>
  <text x="400" y="407" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">⚠️ 사람의 꼼꼼한 테스트 &amp; 자물쇠(보안) 점검 필수</text>
</svg>
