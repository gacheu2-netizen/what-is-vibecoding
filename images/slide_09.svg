<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="yellowBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="20" fill="url(#bg9)"/>

  <!-- 좌측: 알록달록 장난감 블록들 -->
  <g transform="translate(100, 110)" filter="url(#shadow9)">
    <!-- 파란 블록 -->
    <rect x="30" y="170" width="80" height="80" rx="14" fill="#38bdf8"/>
    <circle cx="50" cy="160" r="12" fill="#0284c7"/>
    <circle cx="90" cy="160" r="12" fill="#0284c7"/>
    
    <!-- 초록 블록 -->
    <rect x="120" y="170" width="80" height="80" rx="14" fill="#34d399"/>
    <circle cx="140" cy="160" r="12" fill="#059669"/>
    <circle cx="180" cy="160" r="12" fill="#059669"/>
    
    <!-- 빨간 블록 (위에 쌓임) -->
    <rect x="75" y="80" width="80" height="80" rx="14" fill="#f43f5e"/>
    <circle cx="95" cy="70" r="12" fill="#e11d48"/>
    <circle cx="135" cy="70" r="12" fill="#e11d48"/>
  </g>

  <!-- 우측: 커다랗고 둥근 노란색 'START' 버튼과 손가락 -->
  <g transform="translate(420, 80)" filter="url(#shadow9)">
    <!-- 외곽 그림자 링 -->
    <circle cx="150" cy="150" r="125" fill="#78350f" opacity="0.4"/>
    <!-- 버튼 본체 -->
    <circle cx="150" cy="140" r="120" fill="url(#yellowBtn)"/>
    <circle cx="150" cy="140" r="95" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="8 6"/>
    <!-- 텍스트 -->
    <text x="150" y="145" font-family="sans-serif" font-size="34" font-weight="900" fill="#78350f" text-anchor="middle">START</text>
    <text x="150" y="175" font-family="sans-serif" font-size="16" font-weight="bold" fill="#854d0e" text-anchor="middle">시작하기</text>

    <!-- 귀여운 찰흙 손가락 (버튼을 누르려는 모션) -->
    <path d="M 120 280 C 130 230 145 190 150 170 C 153 160 162 160 165 170 C 170 190 180 230 190 280 Z" fill="#fed7aa" filter="url(#shadow9)"/>
  </g>

  <!-- 텍스트 배너 -->
  <rect x="200" y="380" width="400" height="42" rx="12" fill="rgba(250, 204, 21, 0.15)" stroke="#facc15" stroke-width="1"/>
  <text x="400" y="407" font-family="sans-serif" font-size="16" font-weight="bold" fill="#facc15" text-anchor="middle">🎯 구체적 설명 &amp; 블록 쌓듯 하나씩 차근차근</text>
</svg>
