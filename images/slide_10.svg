<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="20" fill="url(#bg10)"/>

  <!-- 밤하늘 별과 폭죽 -->
  <g opacity="0.8">
    <circle cx="120" cy="80" r="4" fill="#fde047"/>
    <circle cx="240" cy="120" r="5" fill="#fde047"/>
    <circle cx="680" cy="70" r="4" fill="#fde047"/>
    <circle cx="720" cy="150" r="6" fill="#fde047"/>
    <circle cx="150" cy="220" r="3" fill="#fde047"/>
    
    <!-- 폭죽 모양 -->
    <path d="M 620 100 L 630 115 M 620 100 L 610 115 M 620 100 L 635 95 M 620 100 L 605 95 M 620 100 L 620 80" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <path d="M 180 70 L 190 85 M 180 70 L 170 85 M 180 70 L 195 65 M 180 70 L 165 65 M 180 70 L 180 50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 상상의 날개를 단 주인공 캐릭터 -->
  <g transform="translate(400, 200)" filter="url(#shadow10)">
    <!-- 왼쪽 날개 -->
    <path d="M -20 -10 C -120 -80 -180 -10 -150 50 C -120 70 -60 30 -20 10 Z" fill="url(#wingLeft)"/>
    <!-- 오른쪽 날개 -->
    <path d="M 20 -10 C 120 -80 180 -10 150 50 C 120 70 60 30 20 10 Z" fill="url(#wingRight)"/>

    <!-- 몸통 -->
    <rect x="-35" y="-10" width="70" height="90" rx="24" fill="#38bdf8"/>
    <!-- 머리 -->
    <circle cx="0" cy="-60" r="40" fill="#fed7aa"/>
    <!-- 눈 & 미소 -->
    <circle cx="-12" cy="-65" r="4" fill="#0f172a"/>
    <circle cx="12" cy="-65" r="4" fill="#0f172a"/>
    <path d="M -10 -50 Q 0 -40 10 -50" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 안테나 / 반짝이 -->
    <line x1="0" y1="-100" x2="0" y2="-120" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="0" cy="-125" r="9" fill="#fde047"/>
  </g>

  <!-- 텍스트 배너 -->
  <rect x="220" y="380" width="360" height="42" rx="12" fill="rgba(168, 85, 247, 0.2)" stroke="#c084fc" stroke-width="1"/>
  <text x="400" y="407" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e9d5ff" text-anchor="middle">🌈 당신의 상상력이 가장 강력한 도구입니다</text>
</svg>
